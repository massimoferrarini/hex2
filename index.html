<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hex Game Board</title>
<style>
body {
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  margin-top: 40px;
}
.board {
  --size: 40px;
  position: relative;
}
.edge {
  position: absolute;
  font-size: 24px;
  font-weight: bold;
}
.edge.red {
  color: #c00;
}
.edge.black {
  color: #000;
}
.edge.top {
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
}
.edge.bottom {
  bottom: -30px;
  left: 50%;
  transform: translateX(-50%);
}
.edge.left {
  left: -30px;
  top: 50%;
  transform: translateY(-50%);
}
.edge.right {
  right: -30px;
  top: 50%;
  transform: translateY(-50%);
}
.row {
  display: flex;
  height: calc(var(--size) * 0.866);
}
.cell {
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #fafafa, #bbb 65%, #888);
  margin: 0 -1px;
  border: 2px solid #666;
  box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
  box-sizing: border-box;
}
</style>
</head>

  <div class="edge red top">▼</div>
  <div class="edge red bottom">▲</div>
