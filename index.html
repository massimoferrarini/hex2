<title>Hex Game Board</title>
<style>
body {
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  margin-top: 40px;
}
.board {
  --size: 40px;
  position: relative;
}
.edge {
  position: absolute;
  font-size: 24px;
  font-weight: bold;
}
.edge.red {
  color: #c00;
}
.edge.black {
  color: #000;
}
.edge.top {
  top: -30px;
  left: 50%;
  transform: translateX(-50%);
}
.edge.bottom {
  bottom: -30px;
  left: 50%;
  transform: translateX(-50%);
}
.edge.left {
  left: -30px;
  top: 50%;
  transform: translateY(-50%);
}
.edge.right {
  right: -30px;
  top: 50%;
  transform: translateY(-50%);
}
.row {
  display: flex;
  height: calc(var(--size) * 0.866);
}
.cell {
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, #fafafa, #bbb 65%, #888);
  margin: 0 -1px;
  border: 2px solid #666;
  box-shadow: inset 0 4px 8px rgba(0,0,0,0.5);
  box-sizing: border-box;
  position: relative;
  cursor: pointer;
}

.ball {
  position: absolute;
  top: 10%;
  left: 10%;
  width: 80%;
  height: 80%;
  border-radius: 50%;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.6),
              inset 0 -2px 4px rgba(0,0,0,0.6);
}

.ball.red {
  background: radial-gradient(circle at 50% 30%, #fcc, #800);
}

.ball.black {
  background: radial-gradient(circle at 50% 30%, #eee, #000);
}
</style>
</head>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let nextColor = 'red';

function playTone(freq, duration) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playDing() {
  playTone(880, 0.3);
}

function playBong() {
  playTone(220, 0.5);
}

document.querySelectorAll('.cell').forEach(cell => {
  cell.addEventListener('click', () => {
    if (cell.querySelector('.ball')) {
      playBong();
      return;
    }
    const ball = document.createElement('div');
    ball.className = 'ball ' + nextColor;
    cell.appendChild(ball);
    playDing();
    nextColor = nextColor === 'red' ? 'black' : 'red';
  });
});
</script>
